<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .sleeve { fill: #181715 }
    .hole { fill: #f1eee8 }
    .disc { fill: #d9442a }
    @media (prefers-color-scheme: dark) {
      .sleeve { fill: #ebe8e1 }
      .hole { fill: #100f0e }
      .disc { fill: #ff6b47 }
    }
  </style>
  <!-- Same mark as the logo, reproportioned to fill a square evenly. -->
  <circle class="disc" cx="20" cy="16" r="10" />
  <circle class="hole" cx="20" cy="16" r="1.9" />
  <rect class="sleeve" x="2" y="3" width="15" height="26" rx="2.6" />
</svg>
